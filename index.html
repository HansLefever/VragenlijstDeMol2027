<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>De Mol 2027 · Vragenlijst</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f7f2;font-family:Arial,sans-serif;min-height:100dvh;background:radial-gradient(circle at 50% 0,rgba(133,209,72,.12),transparent 32%),#000}.wrap{width:min(94%,760px);margin:auto;padding:22px 0 40px}.brand{color:#85d148;text-transform:uppercase;letter-spacing:.2em;font-weight:900;font-size:.78rem}.card{margin-top:18px;background:#0d120d;border:1px solid #253025;border-radius:22px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}h1{font-size:clamp(2rem,7vw,3.1rem);margin:10px 0}h2{font-size:clamp(1.4rem,5vw,2.05rem);line-height:1.2}.muted,.counter,.version{color:#99a595}.version{text-align:center;font-size:.82rem;margin-top:12px}select,button,textarea,input{font:inherit}select,textarea{width:100%;padding:15px;background:#111811;color:#fff;border:1px solid #253025;border-radius:14px;min-height:52px}textarea{min-height:145px;resize:vertical}button{border:0;border-radius:14px;padding:15px;font-weight:900;min-height:52px;cursor:pointer}.primary{background:#85d148;color:#071007}.secondary{background:#182018;color:#fff}.full{width:100%;margin-top:14px}.top{display:flex;justify-content:space-between;gap:12px}.progress{height:6px;background:#182018;border-radius:99px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:#85d148}.options{display:grid;gap:12px}.option{display:flex;gap:12px;padding:15px;background:#111811;border:1px solid #253025;border-radius:14px;cursor:pointer}.option.selected{outline:2px solid #85d148;background:#142014}.option input{accent-color:#85d148}.letter{color:#85d148;font-weight:900}.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.hidden{display:none!important}.msg{margin-top:14px;padding:12px;border:1px solid #253025;border-radius:12px}.error{color:#ffc2c2;border-color:#7b2d2d}.ok{color:#dfffd0;border-color:#3c6d2b}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:.86rem;color:var(--muted);font-weight:700}
.form-field input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#101710;color:var(--text);font-size:1rem}
.form-field input:focus{outline:2px solid rgba(133,209,72,.35);border-color:var(--green)}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}

</style></head><body><div class="wrap"><div class="brand">De Mol 2027 · Persoonlijke vragenlijst</div><section id="start" class="screen active">
  <main class="app">
    <article class="card">
      <div class="kicker">DE MOL 2027</div>
      <h1 class="question">Persoonlijk dossier</h1>
      <p class="note" style="text-align:left;margin-top:0">
        Vul eerst je persoonsgegevens in. Daarna volgen 40 vragen.
      </p>
      <div class="form-grid">
        <div class="form-field"><label for="firstName">Voornaam</label><input id="firstName" type="text" autocomplete="given-name" required></div>
        <div class="form-field"><label for="lastName">Familienaam</label><input id="lastName" type="text" autocomplete="family-name" required></div>
        <div class="form-field"><label for="birthDate">Geboortedatum</label><input id="birthDate" type="date" required></div>
        <div class="form-field"><label for="birthPlace">Geboorteplaats</label><input id="birthPlace" type="text" required></div>
        <div class="form-field full"><label for="address">Adres</label><input id="address" type="text" autocomplete="street-address" required></div>
        <div class="form-field"><label for="postalCode">Postcode</label><input id="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" required></div>
        <div class="form-field"><label for="city">Gemeente</label><input id="city" type="text" autocomplete="address-level2" required></div>
        <div class="form-field"><label for="phone">Telefoonnummer</label><input id="phone" type="tel" autocomplete="tel" required></div>
        <div class="form-field"><label for="email">E-mailadres <span style="font-weight:400">(optioneel)</span></label><input id="email" type="email" autocomplete="email"></div>
      </div>
      <p id="startMsg" class="msg error hidden"></p>
      <button id="startBtn" class="primary full" style="margin-top:18px">Start vragenlijst →</button>
      <p class="version">Versie 2.0</p>
    </article>
  </main>
</section><section id="quiz" class="card hidden"><div class="top"><div id="who" class="brand"></div><div id="counter" class="counter"></div></div><div class="progress"><div id="bar"></div></div><div id="qno" class="brand"></div><h2 id="question"></h2><div id="options" class="options"></div><textarea id="openAnswer" class="hidden" placeholder="Typ hier je antwoord..."></textarea><div class="nav"><button id="prev" class="secondary">← Vorige</button><button id="next" class="primary">Volgende →</button></div><div id="quizMsg" class="msg error hidden"></div></section><section id="review" class="card hidden"><div class="brand">Bijna klaar</div><h1>Controleer je antwoorden</h1><p id="reviewText"></p><button id="backBtn" class="secondary full">← Terug naar vragen</button><button id="submitBtn" class="primary full">Antwoorden definitief indienen</button><div id="submitMsg" class="msg hidden"></div></section><section id="done" class="card hidden" style="text-align:center"><div class="brand">Vragenlijst voltooid</div><h1>Bedankt!</h1><p>Je antwoorden zijn opgeslagen.</p><p class="muted">Je mag deze pagina nu sluiten.</p></section><p class="version">Versie 2.0</p></div><script src="questions.js"></script><script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
